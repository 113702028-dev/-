<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusFlow - 專注白噪音番茄鐘</title>
  <!-- 導入 Tailwind CSS 快速打造現代質感介面 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 導入 Google Fonts (Inter & JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* 自訂 SVG 圓環旋轉轉場動畫 */
    .progress-ring__circle {
      transition: stroke-dashoffset 0.35s;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    /* 自訂 Range Input 樣式 */
    input[type=range] {
      accent-color: #38bdf8;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-6">

  <!-- 頂部 Header -->
  <header class="w-full max-w-md text-center pt-4">
    <h1 class="text-3xl font-light tracking-wider text-sky-400">FocusFlow</h1>
    <p class="text-xs text-slate-400 mt-1">沉浸式專注與白噪音空間</p>
  </header>

  <!-- 中央主體區域：番茄鐘 -->
  <main class="w-full max-w-md my-auto flex flex-col items-center">
    
    <!-- 模式切換頁籤 -->
    <div class="flex space-x-2 bg-slate-800/80 p-1.5 rounded-full border border-slate-700/50 mb-8 backdrop-blur">
      <button id="mode-work" onclick="setTimerMode('work')" class="px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 bg-sky-500 text-white shadow-lg shadow-sky-500/30">專注 (25m)</button>
      <button id="mode-short" onclick="setTimerMode('short')" class="px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 text-slate-400 hover:text-white">短休 (5m)</button>
      <button id="mode-long" onclick="setTimerMode('long')" class="px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 text-slate-400 hover:text-white">長休 (15m)</button>
    </div>

    <!-- 倒數計時進度圓環與時間 -->
    <div class="relative flex items-center justify-center my-2">
      <svg class="w-72 h-72">
        <circle class="text-slate-800" stroke-width="8" stroke="currentColor" fill="transparent" r="120" cx="144" cy="144"/>
        <circle id="progress-circle" class="progress-ring__circle text-sky-400" stroke-width="8" stroke-dasharray="753.98" stroke-dashoffset="0" stroke-linecap="round" stroke="currentColor" fill="transparent" r="120" cx="144" cy="144"/>
      </svg>
      <div class="absolute flex flex-col items-center">
        <span id="time-display" class="text-6xl font-bold font-mono tracking-tighter text-white">25:00</span>
        <span id="status-label" class="text-xs tracking-widest text-slate-400 mt-2 uppercase">Ready to focus</span>
      </div>
    </div>

    <!-- 計時控制按鈕 -->
    <div class="flex space-x-4 mt-8">
      <button id="start-btn" onclick="toggleTimer()" class="w-32 py-3 bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold rounded-xl shadow-lg shadow-sky-500/20 transition-all active:scale-95">開始</button>
      <button onclick="resetTimer()" class="px-5 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 transition-all active:scale-95">重置</button>
    </div>
  </main>

  <!-- 下方白噪音控制面板 -->
  <section class="w-full max-w-md bg-slate-800/40 border border-slate-800 rounded-2xl p-5 backdrop-blur-md">
    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 text-center">環境白噪音混音器</h2>
    
    <div class="space-y-4">
      <!-- 噪音卡片 1：雨聲 -->
      <div class="flex items-center justify-between bg-slate-800/60 p-3 rounded-xl border border-slate-700/40">
        <div class="flex items-center space-x-3">
          <button id="btn-rain" onclick="toggleSound('rain')" class="w-10 h-10 rounded-lg bg-slate-700 flex items-center justify-center text-lg hover:bg-slate-600 transition">🌧️</button>
          <div>
            <div class="text-sm font-medium">窗外雨聲</div>
            <div class="text-xs text-slate-400" id="status-rain">已關閉</div>
          </div>
        </div>
        <input type="range" min="0" max="1" step="0.01" value="0.5" oninput="changeVolume('rain', this.value)" class="w-24 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
      </div>

      <!-- 噪音卡片 2：篝火 -->
      <div class="flex items-center justify-between bg-slate-800/60 p-3 rounded-xl border border-slate-700/40">
        <div class="flex items-center space-x-3">
          <button id="btn-fire" onclick="toggleSound('fire')" class="w-10 h-10 rounded-lg bg-slate-700 flex items-center justify-center text-lg hover:bg-slate-600 transition">🔥</button>
          <div>
            <div class="text-sm font-medium">溫暖篝火</div>
            <div class="text-xs text-slate-400" id="status-fire">已關閉</div>
          </div>
        </div>
        <input type="range" min="0" max="1" step="0.01" value="0.5" oninput="changeVolume('fire', this.value)" class="w-24 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
      </div>

      <!-- 噪音卡片 3：咖啡廳 -->
      <div class="flex items-center justify-between bg-slate-800/60 p-3 rounded-xl border border-slate-700/40">
        <div class="flex items-center space-x-3">
          <button id="btn-cafe" onclick="toggleSound('cafe')" class="w-10 h-10 rounded-lg bg-slate-700 flex items-center justify-center text-lg hover:bg-slate-600 transition">☕</button>
          <div>
            <div class="text-sm font-medium">悠閒咖啡廳</div>
            <div class="text-xs text-slate-400" id="status-cafe">已關閉</div>
          </div>
        </div>
        <input type="range" min="0" max="1" step="0.01" value="0.5" oninput="changeVolume('cafe', this.value)" class="w-24 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
      </div>
    </div>
  </section>

  <!-- 頁腳 -->
  <footer class="mt-6 text-center text-xs text-slate-500">
    FocusFlow &copy; Built with Vibe Coding
  </footer>

  <!-- JavaScript 邏輯 (計時器 + Web Audio API 生成音效) -->
  <script>
    /* ==================== 1. 番茄鐘邏輯 ==================== */
    const MODES = {
      work: { time: 25 * 60, label: "Stay Focused" },
      short: { time: 5 * 60, label: "Short Break" },
      long: { time: 15 * 60, label: "Long Break" }
    };

    let currentMode = 'work';
    let timeLeft = MODES[currentMode].time;
    let timerInterval = null;
    let isRunning = false;

    const timeDisplay = document.getElementById('time-display');
    const statusLabel = document.getElementById('status-label');
    const startBtn = document.getElementById('start-btn');
    const progressCircle = document.getElementById('progress-circle');
    const circumference = 2 * Math.PI * 120; // 半徑 120 的圓周長

    function updateDisplay() {
      const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const secs = (timeLeft % 60).toString().padStart(2, '0');
      timeDisplay.textContent = `${mins}:${secs}`;
      document.title = `${mins}:${secs} - FocusFlow`;

      // 更新進度條
      const totalTime = MODES[currentMode].time;
      const offset = circumference - (timeLeft / totalTime) * circumference;
      progressCircle.style.strokeDashoffset = offset;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        startBtn.textContent = '繼續';
        startBtn.classList.replace('bg-amber-500', 'bg-sky-500');
        isRunning = false;
      } else {
        initAudioContext(); // 確保使用者點擊時喚醒 AudioContext
        isRunning = true;
        startBtn.textContent = '暫停';
        startBtn.classList.replace('bg-sky-500', 'bg-amber-500');
        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.textContent = '開始';
            alert('時間到！休息一下或開始下一個專注週期吧！');
            resetTimer();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      timeLeft = MODES[currentMode].time;
      startBtn.textContent = '開始';
      startBtn.className = "w-32 py-3 bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold rounded-xl shadow-lg shadow-sky-500/20 transition-all active:scale-95";
      updateDisplay();
    }

    function setTimerMode(mode) {
      currentMode = mode;
      statusLabel.textContent = MODES[mode].label;
      ['work', 'short', 'long'].forEach(m => {
        const btn = document.getElementById(`mode-${m}`);
        if (m === mode) {
          btn.className = "px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 bg-sky-500 text-white shadow-lg shadow-sky-500/30";
        } else {
          btn.className = "px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 text-slate-400 hover:text-white";
        }
      });
      resetTimer();
    }

    /* ==================== 2. Web Audio API 白噪音合成器 ==================== */
    let audioCtx = null;
    const sounds = {
      rain: { active: false, gainNode: null, source: null, volume: 0.5 },
      fire: { active: false, gainNode: null, source: null, volume: 0.5 },
      cafe: { active: false, gainNode: null, source: null, volume: 0.5 }
    };

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 粉紅噪音生成器 (雨聲基礎)
    function createPinkNoiseNode() {
      const bufferSize = audioCtx.sampleRate * 2;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;

      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
        output[i] *= 0.11;
        b6 = white * 0.115926;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;
      return noise;
    }

    function toggleSound(type) {
      initAudioContext();
      const sound = sounds[type];
      const btn = document.getElementById(`btn-${type}`);
      const status = document.getElementById(`status-${type}`);

      if (sound.active) {
        // 關閉聲音
        sound.source.stop();
        sound.active = false;
        btn.classList.remove('bg-sky-500', 'text-white');
        btn.classList.add('bg-slate-700');
        status.textContent = '已關閉';
        status.classList.remove('text-sky-400');
        status.classList.add('text-slate-400');
      } else {
        // 開啟聲音
        sound.gainNode = audioCtx.createGain();
        sound.gainNode.gain.value = sound.volume;

        if (type === 'rain') {
          // 低通濾波器模擬雨聲
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 800;
          sound.source = createPinkNoiseNode();
          sound.source.connect(filter);
          filter.connect(sound.gainNode);
        } else if (type === 'fire') {
          // 帶通濾波器模擬柴火聲
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 400;
          sound.source = createPinkNoiseNode();
          sound.source.connect(filter);
          filter.connect(sound.gainNode);
        } else if (type === 'cafe') {
          // 雙濾波混音模擬咖啡廳雜音
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 1200;
          sound.source = createPinkNoiseNode();
          sound.source.connect(filter);
          filter.connect(sound.gainNode);
        }

        sound.gainNode.connect(audioCtx.destination);
        sound.source.start();
        sound.active = true;

        btn.classList.remove('bg-slate-700');
        btn.classList.add('bg-sky-500', 'text-white');
        status.textContent = '播放中';
        status.classList.remove('text-slate-400');
        status.classList.add('text-sky-400');
      }
    }

    function changeVolume(type, val) {
      sounds[type].volume = parseFloat(val);
      if (sounds[type].gainNode) {
        sounds[type].gainNode.gain.value = sounds[type].volume;
      }
    }

    // 初始化頁面
    updateDisplay();
  </script>
</body>
</html>
